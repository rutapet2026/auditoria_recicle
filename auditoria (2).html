<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría de jornada — Ruta Pet</title>
<style>
  :root{--bg:#F4F7F6;--text:#2C3E50;--muted:#7F8C8D;--green:#27AE60;--red:#E74C3C;--border:#DDE4E0;--card:#fff;--head:#0d1f3c}
  @media (prefers-color-scheme:dark){:root{--bg:#12161c;--text:#e6edf3;--muted:#8b98a5;--border:#2d3748;--card:#1e2640}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}
  header{background:var(--head);color:#fff;padding:22px 20px}
  header h1{font-size:18px} header p{font-size:12px;opacity:.6;margin-top:4px}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:14px}
  .ck{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .ck:last-child{border:0} .ok{color:var(--green)} .ko{color:var(--red)}
  .mono{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}
  a{color:#3498DB} .wrap{overflow-x:auto}
</style>
</head>
<body>
<header><a id="atras" href="#" onclick="history.back();return false" style="display:none;color:#fff;font-size:14px;text-decoration:none;margin-bottom:8px">← Volver</a><h1>Auditoría de jornada · Ruta Pet</h1><p>Verificación pública sobre IPFS y Solana Devnet</p></header>
<main>
  <div class="card" id="estado">Cargando…</div>
  <div class="card" id="resumen" hidden></div>
  <div class="card" id="drop" hidden>
    <h2>Verificar un archivo de evidencia</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px">Elige la foto o el video original. Se calcula su SHA-256 en tu dispositivo y se compara con el registrado.</p>
    <input type="file" id="f" accept="image/*,video/*"><div id="dropRes" style="margin-top:10px;font-size:14px"></div>
    <button id="btnVer" onclick="verificarFotos()" style="margin:12px 0 6px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text)">Verificar todas las fotos públicas</button><div id="verRes" style="font-size:14px"></div>
  </div>
  <div class="card wrap" id="tabla" hidden></div>
</main>
<script>
const q = new URLSearchParams(location.search), cid = q.get('cid') || '', tx = q.get('tx') || '';
const GATEWAYS = ['https://ipfs.io/ipfs/', 'https://dweb.link/ipfs/', 'https://gateway.pinata.cloud/ipfs/'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
const sha = async b => hex(await crypto.subtle.digest('SHA-256', b));
const $ = id => document.getElementById(id);
if (history.length > 1) $('atras').style.display = 'inline-block';   // solo aparece si hay a dónde volver
const ck = (ok, txt) => `<div class="ck"><span class="${ok ? 'ok' : 'ko'}">${ok ? '✓' : '✗'}</span><span>${txt}</span></div>`;
let J = null;
const okCid = c => /^[A-Za-z0-9]{40,100}$/.test(c || '');
const fotoCell = p => okCid(p.evidencia.cid)
  ? `<a target="_blank" rel="noopener" href="${GATEWAYS[0]}${p.evidencia.cid}"><img src="${GATEWAYS[0]}${p.evidencia.cid}" data-g="0" data-cid="${p.evidencia.cid}" onerror="otraPuerta(this)" loading="lazy" width="56" height="56" style="object-fit:cover;border-radius:8px"></a><div class="mono">${esc(p.evidencia.origen || '—')}</div>`
  : '<span class="mono">sin foto pública</span>';
function otraPuerta(img) { const g = +img.dataset.g + 1; if (g < GATEWAYS.length) { img.dataset.g = g; img.src = GATEWAYS[g] + img.dataset.cid; } }
async function verificarFotos() {
  $('btnVer').disabled = true; let bien = 0, mal = 0, sin = 0;
  for (const p of J.paradas) {
    const c = p.evidencia.cid; if (!okCid(c)) { sin++; continue; }
    let hash = null;
    for (const g of GATEWAYS) { try { const r = await fetch(g + c); if (r.ok) { hash = await sha(await r.arrayBuffer()); break; } } catch (e) {} }
    const bueno = hash === p.evidencia.sha256; bueno ? bien++ : mal++;
    $('v' + p.n).innerHTML = bueno ? '<span class="ok">✓ coincide</span>' : '<span class="ko">✗ distinta</span>';
    $('verRes').innerHTML = `Verificadas: ${bien} coinciden · ${mal} no coinciden · ${sin} sin foto pública`;
  }
  $('btnVer').disabled = false;
}

async function leerIPFS() {
  for (const g of GATEWAYS) { try { const r = await fetch(g + cid); if (r.ok) return await r.json(); } catch (e) {} }
  throw new Error('No se pudo leer el CID desde los gateways IPFS.');
}
async function leerMemo() {
  const r = await fetch('https://api.devnet.solana.com', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'getTransaction', params: [tx, { encoding: 'jsonParsed', maxSupportedTransactionVersion: 0, commitment: 'confirmed' }] }) });
  const d = (await r.json()).result;
  if (!d) return null;
  const ix = d.transaction.message.instructions.find(i => i.program === 'spl-memo');
  return { memo: ix ? String(ix.parsed) : '', fecha: d.blockTime ? new Date(d.blockTime * 1000).toLocaleString('es-CO') : '' };
}

(async () => {
  if (!/^[A-Za-z0-9]{40,100}$/.test(cid)) { $('estado').textContent = 'Falta un CID válido en el enlace (?cid=…).'; return; }
  try {
    J = await leerIPFS();
    const { hash, ...base } = J;
    const hashOk = hash === await sha(new TextEncoder().encode(JSON.stringify(base)));
    const suma = +(J.paradas.reduce((a, p) => a + p.gramos, 0) / 1000).toFixed(3);
    const totalOk = suma === J.total_kg && J.paradas.length === J.total_paradas;
    const malas = J.paradas.filter(p => !(Number.isFinite(p.gramos) && p.gramos > 0)).map(p => '#' + p.n);
    const conGps = J.paradas.filter(p => p.gps).length;
    const conCid = J.paradas.filter(p => okCid(p.evidencia.cid)).length, gal = J.paradas.filter(p => p.evidencia.origen === 'galeria').length;
    let memoHtml = '';
    if (/^[1-9A-HJ-NP-Za-km-z]{60,100}$/.test(tx)) {
      const m = await leerMemo();
      memoHtml = m ? ck(m.memo.includes(cid), `El Memo en Solana Devnet contiene este CID${m.fecha ? ' · sellado ' + esc(m.fecha) : ''}`) : ck(false, 'Transacción no encontrada en Devnet');
    } else memoHtml = ck(false, 'No se indicó transacción (?tx=…)');
    $('estado').innerHTML = '<h2>Verificaciones</h2>' + ck(hashOk, 'El hash SHA-256 del contenido coincide (no fue alterado)') + ck(totalOk, `Los pesos suman ${esc(J.total_kg)} kg en ${esc(J.total_paradas)} paradas`)
      + ck(!malas.length, malas.length ? `Paradas con peso inválido o vacío: ${esc(malas.join(', '))}` : 'Todas las paradas tienen un peso válido')
      + ck(conGps === J.paradas.length, `GPS registrado en ${conGps} de ${J.paradas.length} paradas`)
      + ck(conCid === J.paradas.length, `Fotos públicas en IPFS: ${conCid} de ${J.paradas.length}`)
      + ck(gal === 0, gal ? `${gal} foto(s) elegidas de la galería (no verificables como tomadas en el momento)` : 'Todas las fotos fueron tomadas con la cámara de la app') + memoHtml
      + `<div class="mono" style="margin-top:8px">CID: ${esc(cid)}<br>Hash: ${esc(hash)}</div>`;
    $('resumen').hidden = false;
    $('resumen').innerHTML = `<h2>Jornada ${esc(J.fecha)}</h2><div style="font-size:32px;font-weight:700">${esc(J.total_kg)} kg</div><div class="mono">${esc(J.esquema)}</div>`;
    $('tabla').hidden = false; $('drop').hidden = false;
    $('tabla').innerHTML = '<h2>Paradas</h2><table><tr><th>#</th><th>Hora</th><th>Peso</th><th>GPS</th><th>Foto</th><th>SHA-256</th></tr>' + J.paradas.map(p =>
      `<tr><td>${esc(p.n)}</td><td>${esc(new Date(p.hora).toLocaleTimeString('es-CO'))}</td><td>${esc(p.gramos)} g</td><td>${p.gps ? `<a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(p.gps.lat)}&mlon=${encodeURIComponent(p.gps.lng)}#map=18/${encodeURIComponent(p.gps.lat)}/${encodeURIComponent(p.gps.lng)}">${esc(p.gps.lat)}, ${esc(p.gps.lng)}</a>` : 'sin GPS'}</td><td>${fotoCell(p)}</td><td class="mono" id="v${esc(p.n)}">${esc(p.evidencia.sha256.slice(0, 16))}…</td></tr>`).join('') + '</table>';
  } catch (e) { $('estado').innerHTML = ck(false, esc(e.message)); }
})();

$('f').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f || !J) return;
  $('dropRes').textContent = 'Calculando…';
  const h = await sha(await f.arrayBuffer());
  const p = J.paradas.find(x => x.evidencia.sha256 === h);
  $('dropRes').innerHTML = p ? ck(true, `Coincide con la parada #${esc(p.n)} (${esc(p.gramos)} g)`) : ck(false, 'Este archivo no coincide con ninguna parada de la jornada');
});
</script>
</body>
</html>
