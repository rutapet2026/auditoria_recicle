!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría de jornada — Ruta Pet</title>
<style>
  :root{--bg:#F4F7F6;--text:#2C3E50;--muted:#7F8C8D;--green:#27AE60;--red:#E74C3C;--border:#DDE4E0;--card:#fff;--head:#0d1f3c}
  @media (prefers-color-scheme:dark){:root{--bg:#12161c;--text:#e6edf3;--muted:#8b98a5;--border:#2d3748;--card:#1e2640}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}
  header{background:var(--head);color:#fff;padding:22px 20px}
  header h1{font-size:18px} header p{font-size:12px;opacity:.6;margin-top:4px}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:14px}
  .ck{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .ck:last-child{border:0} .ok{color:var(--green)} .ko{color:var(--red)}
  .mono{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px}
  a{color:#3498DB} .wrap{overflow-x:auto}
</style>
</head>
<body>
